name: Build and deploy GitHub Pages (artifact-based)

# Use the official Pages actions to upload the generated `out/` artifact
# and deploy it directly to GitHub Pages without creating a `gh-pages` branch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # `pages: write` is required to deploy the artifact to Pages
  pages: write
  # `id-token: write` is useful for OIDC flows if you later need them
  id-token: write
  # read access to repository contents for the build step
  contents: read

# Avoid concurrent deployments stepping on each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job: install deps, run tests, and generate the static site under `out/`
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        # Upload the generated `out/` directory as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  # Deploy job: consumes the uploaded artifact and publishes to Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Configure Pages
        # Prepares the Pages deployment environment
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        # This step automatically picks up the artifact uploaded by the build job
        uses: actions/deploy-pages@v5

      - name: Output published URL
        run: |
          # Some deploy actions may not emit a page_url output in all cases.
          # Check if the output is non-empty and print a helpful message.
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "Published page: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "No page_url output from deploy step. Check Actions logs for deploy-pages step." 
          fi
